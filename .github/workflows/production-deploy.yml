name: Deploy approved production release

on:
  workflow_run:
    workflows: [Publish production images]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful publisher run ID for current master; inspect any prior rollout before selecting
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_run_id: ${{ steps.release.outputs.release_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify publisher, CI, artifact, images and production protections without Coolify credentials
        id: release
        run: node ops/deploy/production-release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}

  deploy:
    needs: prepare
    if: github.ref == 'refs/heads/master' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://admin.heyjo.my.id
    concurrency:
      group: coolify-production-i1ny5d0qigqbvbybbabmzo7l
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Revalidate OWNER approval and current source; capture protected rollback plan
        run: node ops/deploy/production-release.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ needs.prepare.outputs.release_run_id }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PRODUCTION_DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
      - name: Preserve previous immutable references before any Coolify write
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-receipt/plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Update only three image values, deploy once, reconcile and verify
        run: node ops/deploy/production-release.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ needs.prepare.outputs.release_run_id }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PRODUCTION_DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
      - name: Preserve sanitized outcome for rollback or partial-failure reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-receipt/
          if-no-files-found: ignore
          retention-days: 90
