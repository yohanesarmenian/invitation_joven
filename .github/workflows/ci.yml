name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: invitation_ci
          POSTGRES_USER: invitation_ci
          POSTGRES_PASSWORD: invitation_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invitation_ci -d invitation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://invitation_ci:invitation_ci_password@localhost:5432/invitation_ci?schema=public
      # Public deterministic fixture for CI/test only; not a production secret.
      CREDENTIAL_SECRET: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Deploy database migrations
        run: pnpm db:migrate:deploy

      - name: Check migration status
        run: pnpm db:status

      - name: Generate OpenAPI and API client
        run: pnpm api:contract:generate

      - name: Check generated API contract
        run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated/schema.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
