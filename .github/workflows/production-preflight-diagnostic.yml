name: Diagnose production protected configuration drift

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed current master SHA
        required: true
        type: string

permissions: {}

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      github.sha == inputs.source_sha &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: coolify-production-i1ny5d0qigqbvbybbabmzo7l
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compare production snapshots through the GET-only client
        run: node ops/deploy/production-preflight-diagnostic.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
      - name: Preserve sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-preflight-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-receipt/result.json
          if-no-files-found: ignore
          retention-days: 30
